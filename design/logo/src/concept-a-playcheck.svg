<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- A. "Play-check": the play triangle = video, the checkmark = verification.
       The niche is free (fact-checkers have no play signs); we avoid red
       because a red triangle reads as YouTube. -->
