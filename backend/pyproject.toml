[project]
name = "videofactcheck"
version = "0.0.1"
description = "Fact-check pipeline for YouTube videos: transcript → claims → ClaimReview → web search → verdict voting; NLI plausibility layer on Europe PMC/OpenAlex."
requires-python = ">=3.12"
dependencies = [
    "yt-dlp",
    "httpx",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
vfc = "videofactcheck.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["videofactcheck"]
