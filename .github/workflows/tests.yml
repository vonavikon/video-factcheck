name: tests

# Backend unit tests. No network needed: external calls (LLM, search, Europe PMC,
# langfuse) are mocked in the tests, the plausibility layer is disabled by fixtures
# (VFC_PLAUSIBILITY=0), no keys required. The package is installed in editable mode
# so that pytest finds videofactcheck without installing it into the system python.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
          pip install --no-deps -e ./backend
      - name: Backend tests
        run: pytest backend/tests -q
