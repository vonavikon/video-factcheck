name: tests

# Юнит-тесты бэкенда. Сеть не нужна: внешние вызовы (LLM, поиск, Europe PMC,
# langfuse) в тестах замоканы, слой plausibility отключается фикстурами
# (VFC_PLAUSIBILITY=0), ключи не требуются. Пакет ставится в editable-режиме,
# чтобы pytest находил videofactcheck без установки в системный python.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
          pip install --no-deps -e ./backend
      - name: Тесты бэкенда
        run: pytest backend/tests -q
